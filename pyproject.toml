[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "starVLA"
version = "0.1.0"
description = "starVLA policy server for the LIBERO-Recovery benchmark"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["starVLA*"]
namespaces = true
